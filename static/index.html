<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KYC Analyst</title>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #16212c;
    --ink-muted: #5b6b78;
    --line: #c7d2db;
    --accent: #145c62;
    --accent-ink: #fbfdfe;
    --bubble-user: #145c62;
    --bubble-agent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1620;
      --surface: #14202c;
      --ink: #e7edf3;
      --ink-muted: #92a3b2;
      --line: #2a3946;
      --accent: #35a3a8;
      --accent-ink: #0e1620;
      --bubble-user: #1f6a70;
      --bubble-agent: #1a2734;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }
  header h1 {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
  }
  header .tag {
    font-size: 0.74rem;
    color: var(--ink-muted);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    justify-content: center;
  }
  #thread {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .empty {
    color: var(--ink-muted);
    font-size: 0.92rem;
    line-height: 1.6;
    padding-top: 1rem;
  }
  .empty button {
    display: block;
    margin: 0.4rem 0;
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.86rem;
    cursor: pointer;
    text-align: left;
  }
  .empty button:hover { border-color: var(--accent); }

  .msg {
    max-width: 82%;
    padding: 0.65rem 0.9rem;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 0.94rem;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--accent-ink);
    border-bottom-right-radius: 3px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--bubble-agent);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
  }
  .msg.error {
    align-self: flex-start;
    background: var(--bubble-agent);
    border: 1px solid #b0403f;
    color: #b0403f;
  }
  .msg.pending { color: var(--ink-muted); font-style: italic; }

  form {
    border-top: 1px solid var(--line);
    padding: 1rem 1.25rem 1.4rem;
    display: flex;
    justify-content: center;
  }
  .composer {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 0.6rem;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.94rem;
    padding: 0.65rem 0.8rem;
    line-height: 1.4;
    max-height: 8rem;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.send {
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0 1.2rem;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>KYC Analyst</h1>
    <span class="tag">GraphRAG &middot; Neo4j &middot; OpenAI Agent SDK</span>
  </header>

  <main>
    <div id="thread">
      <div class="empty" id="empty-state">
        Ask about customers, accounts, or suspicious patterns in the KYC graph. Try:
        <button type="button" class="sample">What is the schema of the database?</button>
        <button type="button" class="sample">Show me 3 watchlisted customers involved in rings</button>
        <button type="button" class="sample">For each of these customers, find their addresses and find out if they are shared with other customers</button>
      </div>
    </div>
  </main>

  <form id="composer-form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask a KYC question…"></textarea>
      <button class="send" id="send-btn" type="submit">Send</button>
    </div>
  </form>

<script>
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('empty-state');
  const form = document.getElementById('composer-form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  let history = [];

  function addBubble(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    thread.appendChild(el);
    thread.scrollIntoView({ block: 'end' });
    window.scrollTo(0, document.body.scrollHeight);
    return el;
  }

  async function send(message) {
    if (!message.trim()) return;
    emptyState.remove();
    addBubble('user', message);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    const pending = addBubble('agent pending', 'Thinking…');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history }),
      });
      if (!res.ok) {
        const body = await res.text();
        throw new Error(`${res.status}: ${body}`);
      }
      const data = await res.json();
      pending.textContent = data.reply;
      pending.className = 'msg agent';
      history.push({ role: 'user', content: message });
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      pending.textContent = 'Request failed: ' + err.message;
      pending.className = 'msg error';
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    send(input.value);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 128) + 'px';
  });

  document.querySelectorAll('.sample').forEach((btn) => {
    btn.addEventListener('click', () => send(btn.textContent));
  });
</script>
</body>
</html>
