    <path stroke="#8c9aa6" stroke-width="1.4" fill="none" marker-end="url(#arrow)" d="M385.25,355.25 L222.63,192.63" />
    <path stroke="#8c9aa6" stroke-width="1.4" fill="none" marker-end="url(#arrow)" d="M375,380 L196,380" />
    <path stroke="#8c9aa6" stroke-width="1.4" fill="none" marker-end="url(#arrow)" d="M386.46,405.9 L234.2,573.4" />
    <path stroke="#8c9aa6" stroke-width="1.4" fill="none" marker-end="url(#arrow)" d="M434.17,405.3 L595.83,574.7" />
    <path stroke="#8c9aa6" stroke-width="1.4" fill="none" marker-end="url(#arrow)" d="M244.3,610.97 L425.7,669.03" />
    <path stroke="#8c9aa6" stroke-width="1.4" fill="none" marker-end="url(#arrow)" d="M741.9,236.65 Q814.87,295.06 904.53,321.5" />
    <path stroke="#8c9aa6" stroke-width="1.4" fill="none" marker-end="url(#arrow)" d="M904.53,321.5 Q831.53,263.14 741.9,236.65" />

    <!-- dashed memory edges -->
    <path stroke="#6f4fb0" stroke-width="1.4" fill="none" stroke-dasharray="5 4" opacity="0.85" marker-end="url(#arrow-memory)" d="M802.02,513.86 L443.12,391.31" />
    <path stroke="#6f4fb0" stroke-width="1.4" fill="none" stroke-dasharray="5 4" opacity="0.85" marker-end="url(#arrow-memory)" d="M813.46,502.16 L722.4,253.8" />
    <path stroke="#6f4fb0" stroke-width="1.4" fill="none" stroke-dasharray="5 4" opacity="0.85" marker-end="url(#arrow-memory)" d="M830.54,504.19 L917.81,373.28" />

