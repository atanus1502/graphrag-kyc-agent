      <text x="940" y="346" text-anchor="middle" font-size="18" font-weight="700" font-family="-apple-system, Segoe UI, system-ui, Roboto, sans-serif" fill="#fbfdfe">Tx</text>
      <text x="940" y="401" text-anchor="middle" font-size="12.5" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#16212c">Transaction</text>
      <text x="940" y="415" text-anchor="middle" font-size="10" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#5b6b78">119,951</text>

      <!-- Memory -->
