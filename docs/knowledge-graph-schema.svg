      <text x="210" y="671" text-anchor="middle" font-size="10" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#5b6b78">16,391</text>

      <!-- IP_Address -->
      <circle cx="460" cy="680" r="36" fill="#2f8f8a" />
      <text x="460" y="686" text-anchor="middle" font-size="15" font-weight="700" font-family="-apple-system, Segoe UI, system-ui, Roboto, sans-serif" fill="#fbfdfe">IP</text>
