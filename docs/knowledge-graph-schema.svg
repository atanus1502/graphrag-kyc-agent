<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" role="img" aria-label="Graph diagram of the KYC database schema: a Customer node connects to Account, Company, Address, Device and Payment_Method; Device connects to IP_Address; Account and Transaction connect both ways; a Memory node points into Customer, Account and Transaction with dashed edges.">
  <title>Knowledge graph schema — KYC Agent</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path fill="#8c9aa6" d="M0,0 L10,5 L0,10 z" />
    </marker>
    <marker id="arrow-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path fill="#6f4fb0" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="800" rx="14" fill="#ffffff" stroke="#c7d2db" stroke-width="1" />

  <text x="30" y="42" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#5b6b78">NEO4J AURADB · INSTANCE E92863B9</text>
  <text x="30" y="70" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#16212c">Knowledge graph schema</text>

  <g font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#5b6b78" font-size="11">
    <text x="1030" y="42" text-anchor="end">9 node labels · 11 relationship types</text>
    <text x="1030" y="58" text-anchor="end">198,439 nodes · 314,997 relationships</text>
  </g>

  <g transform="translate(0,20)">
