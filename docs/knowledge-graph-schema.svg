      <text x="200" y="223" text-anchor="middle" font-size="12.5" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#16212c">Company</text>
      <text x="200" y="237" text-anchor="middle" font-size="10" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#5b6b78">1,600</text>

      <!-- Address -->
