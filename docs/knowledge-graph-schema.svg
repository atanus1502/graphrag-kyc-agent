      <text x="820" y="524" text-anchor="middle" font-size="10" font-weight="700" font-family="-apple-system, Segoe UI, system-ui, Roboto, sans-serif" fill="#fbfdfe">Me</text>
      <text x="820" y="559" text-anchor="middle" font-size="12.5" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#16212c">Memory</text>
