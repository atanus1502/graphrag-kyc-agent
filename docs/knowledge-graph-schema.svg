      <text x="460" y="751" text-anchor="middle" font-size="10" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#5b6b78">16,391</text>

      <!-- Payment_Method -->
      <circle cx="620" cy="600" r="35" fill="#2f8f8a" />
      <text x="620" y="606" text-anchor="middle" font-size="16" font-weight="700" font-family="-apple-system, Segoe UI, system-ui, Roboto, sans-serif" fill="#fbfdfe">Pm</text>
      <text x="620" y="656" text-anchor="middle" font-size="12.5" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#16212c">Payment_Method</text>
      <text x="620" y="670" text-anchor="middle" font-size="10" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" fill="#5b6b78">8,059</text>

      <!-- Transaction -->
